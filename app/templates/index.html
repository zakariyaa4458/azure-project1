<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px;
        }

        .header-content {
            max-width: 900px;
            margin: auto;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            color: #6b7280;
            margin-top: 5px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-button {
            background: #2563eb;
            color: white;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .task-heading {
            margin-bottom: 15px;
        }

        .task {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .task-content h3 {
            margin-bottom: 6px;
        }

        .task-content p {
            color: #6b7280;
        }

        .completed h3 {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .complete-button {
            background: #e5e7eb;
            color: #374151;
        }

        .delete-button {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>Task Manager</h1>
        <p>Organise and keep track of your tasks.</p>
    </div>
</header>

<main>

    <section class="card">

        <h2>Create a task</h2>

        <form id="taskForm">

            <div class="form-group">
                <label for="title">Task title</label>

                <input
                    id="title"
                    type="text"
                    placeholder="Enter task title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    placeholder="Enter task description"
                ></textarea>
            </div>

            <button class="add-button" type="submit">
                Add Task
            </button>

        </form>

    </section>

    <h2 class="task-heading">Your Tasks</h2>

    <section id="taskList"></section>

</main>


<script>

    // Get all tasks from Flask
    async function loadTasks() {

        const response = await fetch("/tasks");
        const tasks = await response.json();

        const taskList = document.getElementById("taskList");

        taskList.innerHTML = "";

        if (tasks.length === 0) {

            taskList.innerHTML = `
                <div class="empty">
                    No tasks yet. Create your first task above.
                </div>
            `;

            return;
        }


        tasks.forEach(task => {

            const taskElement = document.createElement("div");

            taskElement.className =
                task.completed
                ? "task completed"
                : "task";

            taskElement.innerHTML = `

                <div class="task-content">

                    <h3>${escapeHtml(task.title)}</h3>

                    <p>${escapeHtml(task.description)}</p>

                </div>

                <div class="actions">

                    <button
                        class="complete-button"
                        onclick="toggleTask('${task.id}', ${task.completed})"
                    >
                        ${task.completed ? "Undo" : "Complete"}
                    </button>

                    <button
                        class="delete-button"
                        onclick="deleteTask('${task.id}')"
                    >
                        Delete
                    </button>

                </div>
            `;

            taskList.appendChild(taskElement);
        });
    }


    // Create task
    document
        .getElementById("taskForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const title =
                document.getElementById("title").value;

            const description =
                document.getElementById("description").value;


            const response = await fetch("/tasks", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    description: description
                })
            });


            if (response.ok) {

                document
                    .getElementById("taskForm")
                    .reset();

                loadTasks();
            }

        });


    // Complete / undo task
    async function toggleTask(id, completed) {

        await fetch(`/tasks/${id}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                completed: !completed
            })

        });

        loadTasks();
    }


    // Delete task
    async function deleteTask(id) {

        await fetch(`/tasks/${id}`, {
            method: "DELETE"
        });

        loadTasks();
    }


    // Prevent task text being interpreted as HTML
    function escapeHtml(value) {

        const element = document.createElement("div");

        element.textContent = value;

        return element.innerHTML;
    }


    // Load tasks when page opens
    loadTasks();

</script>

</body>
</html>
